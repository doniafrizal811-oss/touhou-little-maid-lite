name: Build TouhouLittleMaid LITE JAR

on:
  push:
    branches: [ main, lite-optimization ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Extract Source Code
      run: |
        if [ -f "TouhouLittleMaid-Orihime-1.20.1.zip" ]; then
          unzip -q TouhouLittleMaid-Orihime-1.20.1.zip
          EXTRACTED_DIR=$(find . -maxdepth 1 -type d -name "*TouhouLittleMaid*" | head -1)
          if [ -n "$EXTRACTED_DIR" ]; then
            cp -r "$EXTRACTED_DIR"/* .
            rm -rf "$EXTRACTED_DIR"
          fi
        fi

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Build with Gradle
      run: |
        chmod +x ./gradlew
        ./gradlew build

    - name: Upload to Releases
      if: success()
      uses: softprops/action-gh-release@v1
      with:
        files: build/libs/*.jar
