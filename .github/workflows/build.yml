name: Build Custom Maid Lite JAR

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-read-only: false

      - name: Generate missing Gradle wrapper JAR
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            gradle wrapper --gradle-version 8.6 --distribution-type bin || true
          fi

      - name: Build with Gradle
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon --stacktrace
        env:
          GRADLE_OPTS: "-Xmx2G -Xms512m"

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: custom-maid-lite-1.20.1
          path: build/libs/*.jar
          retention-days: 30

      - name: Show build output
        run: |
          echo "=== File JAR yang dihasilkan ==="
          ls -lh build/libs/ || echo "Tidak ada file JAR"
          echo ""
          echo "Download JAR di tab 'Artifacts' di bawah halaman ini!"
