name: Build Mod custom-maid-lite

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Mengambil data repository GitHub kamu
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. OTOMATIS EKSTRAK FILE ZIP YANG KAMU UPLOAD
      # (Tanda *.zip bikin dia otomatis cari & ekstrak file zip apa aja yang ada di repo)
      - name: Extract zip file
        run: |
          unzip -o *.zip -d . || true
          rm -f *.zip # Hapus file zip setelah diekstrak biar gak menumpuk pas build

      # 3. Setup Java 17 (Wajib untuk Minecraft 1.20.1)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 4. Paksa gunakan Gradle 8.6 biar gak error Loom/Wrapper
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.6'

      # 5. Berikan izin eksekusi pada gradlew
      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # 6. Proses build mod menjadi .jar
      - name: Build Mod with Gradle
        run: gradle build --no-daemon

      # 7. Simpan file .jar hasil build biar bisa didownload ke HP
      - name: Upload Mod Jar Artifact
        uses: actions/upload-artifact@v4
        with:
          name: custom-maid-lite-1.20.1
          path: build/libs/
          if-no-files-found: warn
